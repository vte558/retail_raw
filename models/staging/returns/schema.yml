version: 2
models:
  - name: stg_return
    description: "Cleaned and standardized return records."
    columns:
      - name: return_id
        description: "Unique identifier for a return."
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: "Identifier of the order associated with the return."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
            
      - name: return_reason
        description: "Reason provided for the return."
        data_tests:
          - not_null
          
      - name: return_date
        description: "Date on which the return was recorded."
        data_tests:
          - not_null
          
