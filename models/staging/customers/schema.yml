version: 2
models:
  - name: stg_customers
    description: "Cleaned and standardized customer records
      from the Bronze retail_raw layer."

    columns:
      - name: customer_id
        description: "Unique customer identifier."
        data_tests:
           - not_null
           - unique
      - name: first_name
        description: "Customer first name."
        data_tests:
          - not_null
       
      - name: last_name
        description: "Customer last name."
        data_tests:
          - not_null
      - name: email
        description: "Normalized customer email."
        data_tests:
          - not_null
          