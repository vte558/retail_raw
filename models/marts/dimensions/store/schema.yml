version: 2
models:
  - name: dim_stores
    description:  "Gold store dimension containing one record per store."
    columns:
      - name: store_id
        description: "Business identifier of the store."
        data_tests:
          - not_null
          - unique
      - name: store_name
        description: "Name of the store."
        data_tests:
          - not_null
          
      - name: city
        description: "City where the store is located."
        data_tests:
          - not_null

      - name: state
        description: "State where the store is located."
        data_tests:
          - not_null
