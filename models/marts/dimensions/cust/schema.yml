version: 2

models:

  - name: dim_customer

    description: "Gold customer dimension containing one record per customer."

    columns:
      - name: customer_sk
        description: "Surrogate key uniquely identifying each customer version."
        data_tests:
          - unique
          - not_null
          

      - name: customer_id
        description: "Business identifier of the customer."
        data_tests:
          - not_null
          - unique

      - name: customer_name
        description: "Customer full name."


      - name: email
        description: "Customer email address."
        data_tests:
          - not_null

      - name: phone
        description: "Customer phone number."

      - name: city
        description: "Customer city."

      - name: state
        description: "Customer state."

      - name: country
        description: "Customer country."

      - name: created_at
        description: "Timestamp when the customer record was created."

      - name: updated_at
        description: "Timestamp when the customer record was last updated."
      
      - name: valid_from
        description: "Timestamp when this customer version became effective."
          
      - name: valid_to
        description: "Timestamp when this customer version stopped being effective."
  
          
      - name: is_current
        description: "Indicates whether this is the current customer version."
        data_tests:
          - not_null
          
