version: 2

models:

  - name: daily_sales

    description: "Daily sales aggregate containing one record per sales or return date."

    columns:

      - name: sales_date
        description: "Calendar date represented by the aggregate."
        data_tests:
          - not_null
          - unique

      - name: order_count
        description: "Number of distinct orders for the date."
        data_tests:
          - not_null

      - name: item_count
        description: "Number of distinct order items for the date."
        data_tests:
          - not_null

      - name: quantity_sold
        description: "Total quantity sold for the date."
        data_tests:
          - not_null

      - name: gross_sales
        description: "Total order-item sales before return/refund adjustments."
        data_tests:
          - not_null

      - name: return_count
        description: "Number of returns recorded for the date."
        data_tests:
          - not_null
  - name: customer_sales

    description: "Customer-level sales aggregate containing one record per customer."

    columns:

      - name: customer_id
        description: "Unique customer identifier."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_customer')
              field: customer_id

      - name: customer_name
        description: "Customer full name."
        data_tests:
          - not_null

      - name: email
        description: "Customer email address."

      - name: city
        description: "Customer city."

      - name: state
        description: "Customer state."

      - name: country
        description: "Customer country."

      - name: order_count
        description: "Number of distinct orders placed by the customer."
        data_tests:
          - not_null

      - name: item_count
        description: "Number of distinct order items purchased by the customer."
        data_tests:
          - not_null

      - name: quantity_purchased
        description: "Total quantity of products purchased by the customer."
        data_tests:
          - not_null

      - name: total_sale_amount
        description: "Total sales amount generated by the customer."
        data_tests:
          - not_null

      - name: average_order_value
        description: "Average sales value per order."
        data_tests:
          - not_null
  - name: product_sales

    description: "Product-level sales aggregate containing one record per product."

    columns:

      - name: product_id
        description: "Unique product identifier."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_product')
              field: product_id

      - name: product_name
        description: "Product name."
        data_tests:
          - not_null

      - name: category
        description: "Product category."
        data_tests:
          - not_null

      - name: brand
        description: "Product brand."

      - name: unit_price
        description: "Current product unit price."
        data_tests:
          - not_null

      - name: order_count
        description: "Number of distinct orders containing the product."
        data_tests:
          - not_null

      - name: item_count
        description: "Number of distinct order items for the product."
        data_tests:
          - not_null

      - name: quantity_sold
        description: "Total units sold for the product."
        data_tests:
          - not_null

      - name: total_sales
        description: "Total sales generated by the product."
        data_tests:
          - not_null

      - name: average_unit_price
        description: "Average transaction unit price for the product."
        data_tests:
          - not_null
      - name: revenue_per_unit
        description: "Average revenue generated per unit sold."
        data_tests:
          - not_null
          